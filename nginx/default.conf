server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The full docker-compose stack supplies optional bridge services by these
    # names. A standalone Northflank deployment does not, so resolve dynamic
    # upstreams only when one of those optional routes is requested instead of
    # refusing to start Nginx at boot.
    resolver 1.1.1.1 1.0.0.1 ipv6=off valid=300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Browser configuration can change between image builds and must not be
    # served from a stale cache. It contains only public browser values.
    location = /nuvio.env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The manifest is deployment metadata, not a content-hashed build asset.
    # Serve the standard type explicitly for Chromium installability checks.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The worker is how a new build reaches an installed PWA. Under the
    # seven-day static-asset rule below, a worker file that a cache keeps is a
    # fix that waits for the cache to expire, so it is revalidated every time.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # IntroDB permits browser CORS only for its own site. The player uses this
    # fixed, read-only bridge so every NuvioWeb deployment can load skip
    # intervals without exposing a generic proxy.
    location = /api/introdb/segments {
        proxy_pass https://api.introdb.app/segments$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host api.introdb.app;
        proxy_set_header Accept application/json;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        add_header Cache-Control "private, max-age=300" always;
    }

    # OAuth token operations require the confidential Trakt client secret.
    # Keep them same-origin, but route them only to the internal bridge.
    location ^~ /api/trakt/ {
        set $trakt_bridge http://trakt-auth-bridge:8080;
        proxy_pass $trakt_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # MDBList OAuth and tracking requests need a same-origin hop: the provider
    # does not answer browser preflights for bearer-authenticated writes.
    location ^~ /api/mdblist/ {
        set $mdblist_bridge http://mdblist-bridge:8080;
        proxy_pass $mdblist_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # Connected Services requests use a fixed, same-origin provider allowlist.
    location ^~ /api/debrid/ {
        set $debrid_bridge http://debrid-api-bridge:8080;
        proxy_pass $debrid_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # Outplayer may append a signed media URL to its callback query. Keep this
    # narrowly scoped route out of the default request-URI access log.
    location ^~ /api/external-return/ {
        access_log off;
        set $external_return_bridge http://external-return-bridge:8080;
        proxy_pass $external_return_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Build assets are not content-hashed, so use a bounded cache lifetime
    # rather than an irreversible immutable cache directive.
    location ~* \.(?:css|js|mjs|wasm|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Supports direct browser requests for current and future SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
